# KEDA ScaledObject configuration for vLLM inference autoscaling.
# Scales pods 0-3 based on LLM-native signals from Prometheus, NOT CPU.
#
# Two triggers (KEDA takes the MAX of the desired replica counts):
#   - kvCacheUsage:    leading indicator (early warning before queue builds)
#   - requestsWaiting: lagging indicator (safety net once queue exists)

# Reference to the vLLM Deployment we're scaling
target:
  namespace: vllm
  deploymentName: vllm-server

# How often KEDA queries Prometheus.
# Lower = more responsive but more Prometheus load. 15s is a healthy default.
pollingInterval: 15

# How long to wait after the last scaling decision before scaling DOWN.
# 300s absorbs L4 spot preemption (typical drain ~30s) without thrashing,
# and gives in-flight requests time to drain on the pod being removed.
cooldownPeriod: 300

# Replica bounds.
# minReplicaCount: 0 means "scale to zero when idle" — the cluster autoscaler
# then drains and reclaims the GPU node, dropping hourly cost to ~$0.10
# (control plane only). This is a key part of the project's cost story.
minReplicaCount: 0
maxReplicaCount: 3   # capped by granted L4 quota

# Prometheus address inside the cluster.
# kube-prometheus-stack default service name when installed with release=prometheus.
prometheus:
  address: http://prometheus-kube-prometheus-prometheus.monitoring.svc:9090

# ─── Triggers ─────────────────────────────────────────────────────────────────

triggers:
  # LEADING INDICATOR — KV cache pressure
  # When KV cache fills, vLLM's PagedAttention starts evicting blocks; TTFT
  # spikes BEFORE the queue builds. 85% threshold gives us ~30s headroom
  # for cluster autoscaler + pod startup before users feel pain.
  kvCacheUsage:
    enabled: true
    threshold: "0.85"
    query: 'max(vllm:gpu_cache_usage_perc{namespace="vllm"})'

  # LAGGING INDICATOR — request queue depth
  # If non-zero, we're already over capacity. 5 is empirical: brief bursts
  # commonly hit 1-3, sustained > 5 means we genuinely need more replicas.
  requestsWaiting:
    enabled: true
    threshold: "5"
    query: 'max(vllm:num_requests_waiting{namespace="vllm"})'
